name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Self-healing: if Pages was ever not set up (a fresh clone, a renamed repo,
  # a deleted environment), this re-runs the whole chain without anyone
  # pushing anything.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (vue-tsc, strict)
        run: npm run typecheck

      - name: CV smoke test (real pipeline on the demo photo)
        run: npm run test:cv

      - name: UI tests (jsdom)
        run: npm test

      # Also fetches the OCR engine into public/ocr (prebuild) — the step below
      # needs it, and check-dist fails if it is missing from the build.
      - name: Build (relative asset paths + dist asset check)
        run: npm run build

      - name: Text recognition (real engine, real page)
        run: npm run test:ocr

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: scano-site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scano-site
          path: dist

      # `enablement: true` creates the Pages site through the API when it does
      # not exist yet — the workflow is therefore never blocked on one manual
      # click after a fork, a rename or a reset.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      # A deploy that "succeeded" but published nothing looks exactly like a
      # white page: index.html arrives, its bundle 404s. Check the live URL for
      # files that only exist in dist/, instead of trusting the green tick.
      - name: Confirm Pages is enabled
        run: |
          repo="${{ github.repository }}"
          if gh api "repos/${repo}/pages" --jq .html_url > /tmp/pages-url; then
            echo "Pages is enabled at $(cat /tmp/pages-url)"
          else
            echo "::error::Pages could not be enabled for ${repo}. Set Settings > Pages > Source to \"GitHub Actions\" once, then re-run this workflow."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the live site is the built app
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          code=""
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          echo "GET $url -> $code"
          if [ "$code" != "200" ]; then echo "::error::page did not return 200"; exit 1; fi
          if ! grep -q 'id="boot"' /tmp/index.html; then
            echo "::error::$url is not the built index.html (serving the repo root?)"
            exit 1
          fi
          for file in manifest.webmanifest sw.js; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "${url}${file}" || true)
            echo "$file -> $c"
            if [ "$c" != "200" ]; then echo "::error::${url}${file} missing - artifact not deployed"; exit 1; fi
          done
          echo "live site verified"
