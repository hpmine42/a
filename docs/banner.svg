    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc061" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc061" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  
  <g transform="translate(78 46) scale(0.42)">
